#
# Run pre-commit hooks. You can run them without installing
#  the hook with
#
# $ pre-commit run --all-files
#
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_stages:
- pre-commit
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    # Manage spaces.
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-added-large-files
    - id: check-symlinks
    - id: mixed-line-ending
      args: [--fix=lf]
    # Check file syntax/format
    -   id: check-xml
    -   id: check-json
    -   id: check-yaml
        args: [--allow-multiple-documents]
    # Security checks.
    - id: detect-private-key
    - id: detect-aws-credentials
      args:
      # See https://github.com/pre-commit/pre-commit-hooks/issues/174
      - --allow-missing-credentials
- repo: https://github.com/google/yamlfmt
  rev: v0.21.0
  hooks:
  - id: yamlfmt
    files: \.(yaml|yml)$
    exclude: 'config\.yaml'

- repo: https://github.com/myint/autoflake
  rev: v2.3.1
  hooks:
    - id: autoflake
      args:
        - --in-place
        - --remove-unused-variables
        - --remove-all-unused-imports
#
# Python linters.
#
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.14.14
  hooks:
  # Run the linter.
  - id: ruff
    args: [--fix]
  - # Run the formatter.
    id: ruff-format
# - repo: https://github.com/pre-commit/mirrors-mypy
#   rev: v1.19.1
#   hooks:
#   - id: mypy
#     additional_dependencies: [types-PyYAML]
#     exclude: ^tests/
- repo: https://github.com/PyCQA/flake8
  rev: 7.3.0
  hooks:
  - id: flake8
- repo: local
  hooks:
    - id: yaml-to-json
      name: Convert vocab YAML to JSON
      entry: python .pre-commit-scripts/yaml-to-json.py
      language: system
      files: ^vocab/.*\.yaml*
      pass_filenames: true
#
# Security linters.
#
- repo: https://github.com/PyCQA/bandit
  rev: 1.9.3
  hooks:
    - id: bandit
      name: bandit
      args: ["-c", ".bandit.yaml"]
      description: 'Bandit is a tool for finding common security issues in Python code'
      entry: bandit
      language: python
      language_version: python3
      types: [python]
- repo: https://github.com/Lucas-C/pre-commit-hooks-safety
  rev: v1.4.2
  hooks:
    - id: python-safety-dependencies-check
      stages:
        - pre-push
- repo: https://github.com/bridgecrewio/checkov.git
  rev: 3.2.497  # change to tag or sha
  hooks:
  - id: checkov
  - id: checkov_secrets
    stages: ["pre-push"]
- repo: local
  hooks:
  - id: trufflehog
    name: TruffleHog v3.93.3
    description: Detect secrets in your data.
    entry: bash -c 'docker run --cpus 2 --rm -v "$(pwd):/workdir" -i --rm
      docker.io/trufflesecurity/trufflehog@sha256:06c1f230512cbb694954716fa5e0adbfb95809c7bfb5a50c25110847417b69db git file:///workdir
      --since-commit origin/main
      --branch HEAD
      --results=verified,unknown --fail'
    language: system
    stages: ["pre-push"]
