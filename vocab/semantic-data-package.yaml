#
# The Semantic Data Package is inspired by
# - https://raw.githubusercontent.com/frictionlessdata/datapackage-fiscal/refs/heads/main/profiles/fiscal-data-package.json
#
# it extends the original table schema with table-schema-jsonld.json schema to support
#   the Linked Data annotations.
#
# When implementing this schema:
# - reference existing schemas and do not duplicate definitions
# - ensure that JSON-LD annotations are used correctly according to the table-schema-jsonld specification
# - do not modify the examples section below, as it is used for testing
# - use the above referenced fiscal data package as an implementation guide
# - validate the schema using the example below
# If you understand that you are not able to follow these instructions, or
#   find that these instructions are not sufficient, don't guess and ask for guidance,
#   because I don't want an implementation that does not follow the intended design.
$id: https://ioggstream.github.io/draft-polli-restapi-ld-keywords/vocab/semantic-data-package.json
$schema: https://json-schema.org/draft/2020-12/schema
title: Semantic Data Package
description: A Data Package profile that extends tabular data
  packages with JSON-LD semantic annotations for linking data
  to RDF vocabularies and ontologies.
type: object
allOf:
- $ref: https://specs.frictionlessdata.io/schemas/data-package.json
- $ref: https://ioggstream.github.io/draft-polli-restapi-ld-keywords/vocab/jsonld-meta.json
- type: object
  properties:
    resources:
      type: array
      minItems: 1
      items:
        allOf:
        - $ref: https://specs.frictionlessdata.io/schemas/data-resource.json
        - $ref: https://ioggstream.github.io/draft-polli-restapi-ld-keywords/vocab/jsonld-meta.json
        - type: object
          properties:
            schema:
              $ref: https://ioggstream.github.io/draft-polli-restapi-ld-keywords/vocab/table-schema-jsonld.json
examples:
- # Example Data Package
  # This is a comprehensive example showing all properties defined in the datapackage schema
  #   and that adds JSON-LD annotations using the table-schema-jsonld extensions.
  $schema: https://ioggstream.github.io/draft-polli-restapi-ld-keywords/vocab/semantic-data-package.json
  # Core metadata
  name: my-nice-name
  id: b03ec84-77fd-4270-813b-0c698943f7ce
  title: My Package Title
  version: 1.0.1-beta
  description: |
    # My Package description
    All about my package.
  # Web links
  homepage: http://example.com/
  image: http://example.com/image.jpg
  # Timestamps
  created: "1985-04-12T23:20:50.52Z"
  # Contributors
  contributors:
  - title: Joe Bloggs
    email: joe@example.com
    givenName: Joe
    familyName: Bloggs
    organization: Example Organization
    path: http://example.com/joe
    roles:
    - author
    - maintainer
  # Keywords
  keywords:
  - data
  - fiscal
  - transparency
  # Licenses
  licenses:
  - name: odc-pddl-1.0
    path: http://opendatacommons.org/licenses/pddl/
    title: Open Data Commons Public Domain Dedication and License
      v1.0
  # Resources (required field)
  resources:
  - name: my-data
    path: data.csv
    title: My Data Resource
    description: |
      # My Resource description
      All about my resource.
    homepage: http://example.com/data
    format: csv
    mediatype: text/csv
    encoding: utf-8
    bytes: 2082
    hash: d25c9c77f588f5dc32059d2da1136c02
    # Table schema
    schema:
      x-jsonld-context:
      fields:
      - name: id
        title: ID
        description: Unique identifier
        type: integer
        constraints:
          required: true
          unique: true
      - name: name
        title: Name
        description: Full name
        type: string
        constraints:
          required: true
      - name: age
        title: Age
        description: Age in years
        type: integer
        constraints:
          minimum: 0
          maximum: 150
      - name: email
        title: Email
        description: Email address
        type: string
        format: email
      - name: created_date
        title: Created Date
        description: Date when record was created
        type: date
        format: default
      primaryKey:
      - id
    # Table dialect
    dialect:
      delimiter: ","
      lineTerminator: "\r\n"
      quoteChar: '"'
      doubleQuote: true
      skipInitialSpace: false
      header: true
      commentChar: "#"
      headerRows:
      - 1
    # Licenses for this resource
    licenses:
    - name: odc-pddl-1.0
      path: http://opendatacommons.org/licenses/pddl/
      title: Open Data Commons Public Domain Dedication and License
        v1.0
  # Example with inline data
  - name: inline-data
    title: Inline Data Example
    description: Example of inline data in a resource
    data:
    - id: 1
      name: Alice
      age: 30
      email: alice@example.com
      created_date: "2020-01-15"
    - id: 2
      name: Bob
      age: 25
      email: bob@example.com
      created_date: "2020-02-20"
    mediatype: application/json
    schema:
      fields:
      - name: id
        type: integer
      - name: name
        type: string
      - name: age
        type: integer
      - name: email
        type: string
        format: email
      - name: created_date
        type: date
- name: agente_causale.expected.datapackage
  resources:
  - dialect:
      inline:
        keyed: true
    format: inline
    name: agente_causale.expected.datapackage
    path: agente_causale.expected.datapackage.csv
    schema:
      fields:
      - name: "@type"
        type: yearmonth
      - name: id
        type: number
      - name: label
        type: string
      - name: level
        type: integer
      - name: parent
        type: array
      - name: url
        type: string
      - name: vocab
        type: array
      x-jsonld-context:
        "@vocab": https://w3id.org/italia/work-accident/controlled-vocabulary/adm_serv/
        INAILService: https://w3id.org/italia/work-accident/onto/adm_serv/
        clvapit: https://w3id.org/italia/onto/CLV/
        dct: http://purl.org/dc/terms/
        id:
          "@id": skos:notation
        label: &id001
          "@id": skos:prefLabel
          "@language": it
        label_de:
          "@id": skos:prefLabel
          "@language": de
        label_en:
          "@id": skos:prefLabel
          "@language": en
        label_it: *id001
        level:
          "@id": xkos:depth
          "@type": xsd:integer
        parent:
          "@container": "@set"
          "@context":
            url: "@id"
          "@id": skos:broader
        skos: http://www.w3.org/2004/02/skos/core#
        url: "@id"
        vocab:
          "@container": "@set"
          "@context":
            url: "@id"
          "@id": skos:inScheme
        xkos: http://rdf-vocabulary.ddialliance.org/xkos#
        xsd: http://www.w3.org/2001/XMLSchema#
      x-jsonld-type:
      - INAILService:AgenteCausaleINAIL
      - skos:Concept
    type: table
